<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Regenex Hair — Avaliacao Gratuita</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue-primary: #1B5EF8;
      --blue-dark:    #1348CC;
      --blue-light:   #EBF2FF;
      --blue-mid:     #C7DCFF;
      --grey-100:     #F5F7FA;
      --grey-200:     #E8ECF2;
      --grey-400:     #9AA5B8;
      --grey-600:     #5A6478;
      --grey-800:     #2C3347;
      --white:        #FFFFFF;
      --green:        #16A34A;
      --radius:       14px;
      --shadow:       0 4px 24px rgba(27,94,248,.10);
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--grey-100);
      color: var(--grey-800);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── HEADER ── */
    .header {
      width: 100%;
      background: var(--white);
      border-bottom: 1px solid var(--grey-200);
      display: flex;
      justify-content: center;
      padding: 18px 24px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .logo-icon {
      width: 38px; height: 38px;
      background: var(--blue-primary);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-icon svg { width: 22px; height: 22px; fill: white; }
    .logo-text { font-size: 1.2rem; font-weight: 800; color: var(--grey-800); letter-spacing: -.5px; }
    .logo-text span { color: var(--blue-primary); }

    /* ── WRAPPER ── */
    .wrapper {
      width: 100%; max-width: 660px;
      padding: 32px 16px 60px;
      display: flex; flex-direction: column; align-items: center; gap: 0;
    }

    /* ── PROGRESS ── */
    .progress-area {
      width: 100%; margin-bottom: 24px;
    }
    .progress-meta {
      display: flex; justify-content: space-between;
      font-size: .8rem; font-weight: 600; color: var(--grey-400);
      margin-bottom: 8px;
    }
    .progress-bar-bg {
      width: 100%; height: 8px;
      background: var(--grey-200); border-radius: 99px; overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%; background: var(--blue-primary);
      border-radius: 99px;
      transition: width .5s cubic-bezier(.4,0,.2,1);
    }

    /* ── CARD ── */
    .card {
      width: 100%;
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 36px 32px;
      animation: fadeUp .4s ease both;
    }
    @keyframes fadeUp {
      from { opacity:0; transform: translateY(16px); }
      to   { opacity:1; transform: translateY(0); }
    }

    .question-label {
      font-size: .75rem; font-weight: 700;
      color: var(--blue-primary); letter-spacing: .08em;
      text-transform: uppercase; margin-bottom: 10px;
    }
    .question-text {
      font-size: 1.25rem; font-weight: 700;
      color: var(--grey-800); line-height: 1.45;
      margin-bottom: 28px;
    }

    /* ── OPTIONS ── */
    .options { display: flex; flex-direction: column; gap: 12px; }

    .option {
      display: flex; align-items: center; gap: 14px;
      padding: 15px 18px;
      border: 2px solid var(--grey-200);
      border-radius: 10px;
      cursor: pointer;
      background: var(--white);
      transition: border-color .2s, background .2s, transform .15s;
      font-size: .95rem; font-weight: 500; color: var(--grey-800);
      text-align: left;
    }
    .option:hover {
      border-color: var(--blue-primary);
      background: var(--blue-light);
      transform: translateX(3px);
    }
    .option.selected {
      border-color: var(--blue-primary);
      background: var(--blue-light);
    }
    .option-bullet {
      width: 22px; height: 22px; min-width: 22px;
      border-radius: 50%;
      border: 2px solid var(--grey-400);
      display: flex; align-items: center; justify-content: center;
      transition: border-color .2s, background .2s;
    }
    .option.selected .option-bullet {
      border-color: var(--blue-primary);
      background: var(--blue-primary);
    }
    .option.selected .option-bullet::after {
      content: '';
      width: 8px; height: 8px;
      background: white; border-radius: 50%;
    }

    /* ── YES/NO ── */
    .yn-options { display: flex; gap: 16px; }
    .yn-btn {
      flex: 1; padding: 20px 10px;
      border-radius: 12px; border: 2.5px solid var(--grey-200);
      background: var(--white); cursor: pointer;
      font-size: 1.05rem; font-weight: 700;
      transition: all .2s;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .yn-btn .yn-icon { font-size: 1.8rem; }
    .yn-btn.yes:hover, .yn-btn.yes.selected {
      border-color: var(--blue-primary); background: var(--blue-light);
      color: var(--blue-primary);
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(27,94,248,.18);
    }
    .yn-btn.no:hover, .yn-btn.no.selected {
      border-color: var(--grey-400); background: var(--grey-100);
      color: var(--grey-600);
    }

    /* ── NEXT BTN ── */
    .btn-next {
      width: 100%; margin-top: 28px;
      padding: 16px;
      background: var(--blue-primary);
      color: white; font-size: 1rem; font-weight: 700;
      border: none; border-radius: 10px; cursor: pointer;
      letter-spacing: .02em;
      transition: background .2s, transform .15s, box-shadow .2s;
      display: none;
    }
    .btn-next:hover {
      background: var(--blue-dark);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(27,94,248,.30);
    }
    .btn-next.visible { display: block; }

    /* ── INTERMEDIATE MESSAGE ── */
    .mid-card {
      width: 100%;
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 40px 32px;
      text-align: center;
      animation: fadeUp .5s ease both;
    }
    .mid-icon {
      width: 72px; height: 72px;
      background: var(--blue-light);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      font-size: 2.2rem;
    }
    .mid-badge {
      display: inline-block;
      background: #DCFCE7; color: var(--green);
      font-size: .78rem; font-weight: 700;
      padding: 4px 12px; border-radius: 99px;
      letter-spacing: .06em; text-transform: uppercase;
      margin-bottom: 16px;
    }
    .mid-title {
      font-size: 1.5rem; font-weight: 800;
      color: var(--grey-800); line-height: 1.35;
      margin-bottom: 14px;
    }
    .mid-title span { color: var(--blue-primary); }
    .mid-body {
      font-size: .98rem; color: var(--grey-600);
      line-height: 1.65; margin-bottom: 28px;
    }
    .mid-highlights {
      display: flex; flex-direction: column; gap: 10px;
      background: var(--grey-100); border-radius: 10px;
      padding: 18px 20px; margin-bottom: 28px; text-align: left;
    }
    .mid-highlight-item {
      display: flex; align-items: center; gap: 10px;
      font-size: .9rem; font-weight: 500; color: var(--grey-800);
    }
    .mid-highlight-item .dot {
      width: 8px; height: 8px; min-width: 8px;
      background: var(--blue-primary); border-radius: 50%;
    }
    .btn-continue {
      width: 100%; padding: 16px;
      background: var(--blue-primary); color: white;
      font-size: 1rem; font-weight: 700;
      border: none; border-radius: 10px; cursor: pointer;
      transition: background .2s, transform .15s, box-shadow .2s;
    }
    .btn-continue:hover {
      background: var(--blue-dark);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(27,94,248,.30);
    }

    /* ── FINAL RESULT ── */
    .result-card {
      width: 100%;
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 40px 32px;
      text-align: center;
      animation: fadeUp .5s ease both;
    }
    .result-icon {
      font-size: 3rem; margin-bottom: 16px;
    }
    .result-badge {
      display: inline-block;
      background: #DCFCE7; color: var(--green);
      font-size: .78rem; font-weight: 700;
      padding: 4px 14px; border-radius: 99px;
      letter-spacing: .06em; text-transform: uppercase;
      margin-bottom: 18px;
    }
    .result-title {
      font-size: 1.55rem; font-weight: 800;
      color: var(--grey-800); line-height: 1.35; margin-bottom: 14px;
    }
    .result-title span { color: var(--blue-primary); }
    .result-body {
      font-size: .96rem; color: var(--grey-600);
      line-height: 1.7; margin-bottom: 28px;
    }
    .result-features {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px; margin-bottom: 28px;
    }
    .result-feature {
      background: var(--blue-light);
      border-radius: 10px; padding: 14px 12px;
      font-size: .85rem; font-weight: 600; color: var(--blue-dark);
      text-align: center;
    }
    .result-feature .f-icon { font-size: 1.3rem; display: block; margin-bottom: 4px; }
    .btn-cta {
      width: 100%; padding: 18px;
      background: var(--blue-primary); color: white;
      font-size: 1.05rem; font-weight: 800;
      border: none; border-radius: 10px; cursor: pointer;
      transition: background .2s, transform .15s, box-shadow .2s;
      letter-spacing: .01em;
    }
    .btn-cta:hover {
      background: var(--blue-dark);
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(27,94,248,.35);
    }
    .cta-sub {
      font-size: .8rem; color: var(--grey-400);
      margin-top: 12px;
    }

    /* ── TRUST BAR ── */
    .trust-bar {
      width: 100%; max-width: 660px;
      padding: 0 16px;
      display: flex; justify-content: center; gap: 24px;
      flex-wrap: wrap; margin-top: 28px;
    }
    .trust-item {
      display: flex; align-items: center; gap: 6px;
      font-size: .78rem; color: var(--grey-400); font-weight: 500;
    }
    .trust-item svg { width: 14px; height: 14px; flex-shrink: 0; }

    /* ── RESPONSIVE ── */
    @media (max-width: 480px) {
      .card, .mid-card, .result-card { padding: 28px 20px; }
      .question-text { font-size: 1.1rem; }
      .result-features { grid-template-columns: 1fr; }
      .yn-options { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <a class="logo" href="#">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C9.5 2 7 4 7 7c0 2.5 1.5 4.5 3.5 5.5C8 14 6 16.5 6 19.5V22h12v-2.5c0-3-2-5.5-4.5-7C15.5 11.5 17 9.5 17 7c0-3-2.5-5-5-5z"/>
        </svg>
      </div>
      <span class="logo-text">Regenex <span>Hair</span></span>
    </a>
  </header>

  <!-- MAIN -->
  <main class="wrapper">
    <div class="progress-area" id="progressArea">
      <div class="progress-meta">
        <span id="progressLabel">Pergunta 1 de 13</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
      </div>
    </div>

    <div id="quizContainer"></div>
  </main>

  <!-- TRUST BAR -->
  <div class="trust-bar">
    <div class="trust-item">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
      100% seguro e gratuito
    </div>
    <div class="trust-item">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
      Suas respostas sao privadas
    </div>
    <div class="trust-item">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      Leva menos de 2 minutos
    </div>
  </div>

  <script>
    const QUESTIONS = [
      // ── Q1–Q7: regular multiple choice ──
      {
        id: 1,
        type: 'choice',
        text: 'Qual e a sua faixa etaria?',
        options: [
          '18 a 29 anos',
          '30 a 39 anos',
          '40 a 49 anos',
          '50 anos ou mais',
        ],
      },
      {
        id: 2,
        type: 'choice',
        text: 'Ha quanto tempo voce esta percebendo a queda de cabelo?',
        options: [
          'Ha menos de 6 meses',
          'Entre 6 meses e 1 ano',
          'Entre 1 e 3 anos',
          'Ha mais de 3 anos',
        ],
      },
      {
        id: 3,
        type: 'choice',
        text: 'Como voce descreveria a intensidade da sua queda de cabelo?',
        options: [
          'Leve — alguns fios a mais no ralo',
          'Moderada — claramente mais que o normal',
          'Intensa — grande volume de cabelos caindo',
          'Severa — falhas ou areas visiveis sem cabelo',
        ],
      },
      {
        id: 4,
        type: 'choice',
        text: 'Em quais regioes voce percebe mais a queda?',
        options: [
          'No topo da cabeca',
          'Na testa / entradas',
          'Em toda a extensao',
          'Nas laterais',
        ],
      },
      {
        id: 5,
        type: 'choice',
        text: 'A queda de cabelo ja afetou sua autoestima ou confianca?',
        options: [
          'Sim, afeta muito o meu dia a dia',
          'As vezes me incomoda bastante',
          'Raramente, mas ja pensei nisso',
          'Ainda nao percebi impacto',
        ],
      },
      {
        id: 6,
        type: 'choice',
        text: 'Alguem na sua familia tambem sofre com queda de cabelo?',
        options: [
          'Sim, do lado paterno',
          'Sim, do lado materno',
          'Sim, dos dois lados',
          'Nao que eu saiba',
        ],
      },
      {
        id: 7,
        type: 'choice',
        text: 'Voce ja tentou algum tratamento para queda de cabelo antes?',
        options: [
          'Sim, mas sem resultado satisfatorio',
          'Sim, mas parei por efeitos colaterais',
          'Sim, com algum resultado parcial',
          'Nunca tentei nenhum tratamento',
        ],
      },
      // ── Q8–Q10: regular multiple choice ──
      {
        id: 8,
        type: 'choice',
        text: 'Voce percebe muita queda durante o banho ou ao pentear?',
        options: [
          'Sim, perco muito cabelo nesses momentos',
          'Sim, mas de forma moderada',
          'Raramente',
          'Nao percebo queda nesses momentos',
        ],
      },
      {
        id: 9,
        type: 'choice',
        text: 'Como esta a densidade do seu cabelo hoje, comparado a 2 anos atras?',
        options: [
          'Muito mais fino e ralo',
          'Um pouco mais fino',
          'Esta igual',
          'Percebi alguma melhora',
        ],
      },
      {
        id: 10,
        type: 'choice',
        text: 'Voce estaria disposto a dedicar alguns minutos por dia a um tratamento 100% natural e sem efeitos colaterais?',
        options: [
          'Sim, com certeza!',
          'Depende de quanto tempo exige',
          'Talvez, se for facil de aplicar',
          'Prefiro algo mais pratico',
        ],
      },
      // ── Q11–Q13: YES/NO ──
      {
        id: 11,
        type: 'yesno',
        text: 'Voce gostaria de ter acesso a um tratamento capaz de ajudar seu cabelo a voltar a crescer em apenas 3 semanas?',
      },
      {
        id: 12,
        type: 'yesno',
        text: 'Se existisse um metodo comprovado para recuperar a densidade do seu cabelo em ate 90 dias, voce teria interesse em conhece-lo?',
      },
      {
        id: 13,
        type: 'yesno',
        text: 'Voce gostaria de receber agora um plano personalizado e gratuito para comecar a reverter a sua queda de cabelo ainda esta semana?',
      },
    ];

    const INTERMEDIATE_AFTER = 7; // show message after Q7

    let currentStep = 0; // 0-based index into QUESTIONS
    let showingMid = false;
    let answers = {};

    const container   = document.getElementById('quizContainer');
    const progressArea = document.getElementById('progressArea');
    const progressFill  = document.getElementById('progressFill');
    const progressLabel = document.getElementById('progressLabel');
    const progressPct   = document.getElementById('progressPct');

    function updateProgress(qNumber) {
      const pct = Math.round(((qNumber - 1) / QUESTIONS.length) * 100);
      progressFill.style.width = pct + '%';
      progressLabel.textContent = 'Pergunta ' + qNumber + ' de ' + QUESTIONS.length;
      progressPct.textContent = pct + '%';
    }

    function renderQuestion(index) {
      const q = QUESTIONS[index];
      updateProgress(q.id);

      if (q.type === 'choice') {
        container.innerHTML = `
          <div class="card">
            <div class="question-label">Pergunta ${q.id} de ${QUESTIONS.length}</div>
            <div class="question-text">${q.text}</div>
            <div class="options" id="options"></div>
            <button class="btn-next" id="btnNext" onclick="handleNext()">Continuar &rarr;</button>
          </div>`;

        const opts = document.getElementById('options');
        q.options.forEach((opt, i) => {
          const btn = document.createElement('button');
          btn.className = 'option';
          btn.innerHTML = `<div class="option-bullet"></div><span>${opt}</span>`;
          btn.onclick = () => selectOption(btn, i, q.id);
          opts.appendChild(btn);
        });
      } else {
        // YES/NO
        container.innerHTML = `
          <div class="card">
            <div class="question-label">Pergunta ${q.id} de ${QUESTIONS.length}</div>
            <div class="question-text">${q.text}</div>
            <div class="yn-options">
              <button class="yn-btn yes" onclick="handleYesNo('sim', ${q.id})">
                <span class="yn-icon">&#x1F44D;</span>
                Sim, quero!
              </button>
              <button class="yn-btn no" onclick="handleYesNo('nao', ${q.id})">
                <span class="yn-icon">&#x274C;</span>
                Nao
              </button>
            </div>
          </div>`;
      }
    }

    function selectOption(btn, idx, qId) {
      document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
      btn.classList.add('selected');
      answers[qId] = idx;
      const nextBtn = document.getElementById('btnNext');
      if (nextBtn) nextBtn.classList.add('visible');
    }

    function handleNext() {
      currentStep++;
      if (currentStep === INTERMEDIATE_AFTER) {
        showMidMessage();
      } else {
        renderQuestion(currentStep);
      }
    }

    function handleYesNo(val, qId) {
      answers[qId] = val;
      setTimeout(() => {
        currentStep++;
        if (currentStep >= QUESTIONS.length) {
          if (val === 'sim') {
            showResult();
          } else {
            showResult(); // show result regardless; CTA copy adapts
          }
        } else {
          renderQuestion(currentStep);
        }
      }, 280);
    }

    function showMidMessage() {
      progressArea.style.display = 'none';
      container.innerHTML = `
        <div class="mid-card">
          <div class="mid-icon">&#x1F4A1;</div>
          <div class="mid-badge">Analise Concluida</div>
          <div class="mid-title">Parece que a sua situacao <span>tem solucao!</span></div>
          <p class="mid-body">
            Com base nas suas respostas, identificamos que voce apresenta um perfil de queda compativel com
            condicoes altamente responsivas a tratamentos modernos. A boa noticia e que esse tipo de queda
            pode ser revertido com a abordagem certa.
          </p>
          <div class="mid-highlights">
            <div class="mid-highlight-item"><div class="dot"></div> Queda com causa identificavel e tratavel</div>
            <div class="mid-highlight-item"><div class="dot"></div> Perfil compativel com recuperacao rapida dos fios</div>
            <div class="mid-highlight-item"><div class="dot"></div> Alta chance de resultado visivel em poucas semanas</div>
          </div>
          <button class="btn-continue" onclick="continueMid()">Ver meu plano personalizado &rarr;</button>
        </div>`;
    }

    function continueMid() {
      progressArea.style.display = 'block';
      renderQuestion(currentStep);
    }

    function showResult() {
      progressArea.style.display = 'none';
      container.innerHTML = `
        <div class="result-card">
          <div class="result-icon">&#x1F3C6;</div>
          <div class="result-badge">Voce e um Candidato Ideal</div>
          <div class="result-title">Seu cabelo <span>pode crescer de novo</span> em ate 3 semanas</div>
          <p class="result-body">
            Parabens por concluir a avaliacao! Com base no seu perfil, o Regenex Hair pode ajudar
            a estimular os foliculos inativos e reverter a queda. Nosso protocolo e natural, sem efeitos
            colaterais e com resultados documentados em menos de 30 dias para a maioria dos usuarios.
          </p>
          <div class="result-features">
            <div class="result-feature"><span class="f-icon">&#x1F33F;</span>100% Natural</div>
            <div class="result-feature"><span class="f-icon">&#x23F1;</span>Resultados em 3 semanas</div>
            <div class="result-feature"><span class="f-icon">&#x1F4C4;</span>Plano personalizado</div>
            <div class="result-feature"><span class="f-icon">&#x1F512;</span>Sem efeitos colaterais</div>
          </div>
          <button class="btn-cta" onclick="handleCTA()">
            Quero meu plano gratuito agora &rarr;
          </button>
          <p class="cta-sub">Acesso limitado &bull; Sem cartao de credito &bull; 100% gratuito</p>
        </div>`;
    }
