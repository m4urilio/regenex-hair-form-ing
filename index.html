<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Regenex Hair — Free Hair Loss Assessment</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2322C55E'/><text x='16' y='23' font-family='Arial,sans-serif' font-size='20' font-weight='bold' fill='white' text-anchor='middle'>R</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue-primary: #22C55E;
      --blue-dark:    #16A34A;
      --blue-deeper:  #15803D;
      --blue-light:   #F0FDF4;
      --blue-mid:     #BBF7D0;
      --grey-100:     #F4F5F7;
      --grey-200:     #E2E6EC;
      --grey-400:     #9AA5B8;
      --grey-600:     #5A6478;
      --grey-800:     #1E2A3B;
      --white:        #FFFFFF;
      --green:        #16A34A;
      --radius:       14px;
      --shadow:       0 4px 28px rgba(34,197,94,.13);
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--grey-100);
      color: var(--grey-800);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── HEADER ── */
    .header {
      width: 100%;
      background: var(--white);
      border-bottom: 1px solid var(--grey-200);
      display: flex;
      justify-content: center;
      padding: 18px 24px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .logo-icon {
      width: 38px; height: 38px;
      background: var(--blue-primary);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-icon svg { width: 22px; height: 22px; fill: white; }
    .logo-text { font-size: 1.2rem; font-weight: 800; color: var(--grey-800); letter-spacing: -.5px; }
    .logo-text span { color: var(--blue-primary); }

    /* ── WRAPPER ── */
    .wrapper {
      width: 100%; max-width: 660px;
      padding: 32px 16px 60px;
      display: flex; flex-direction: column; align-items: center; gap: 0;
    }

    /* ── PROGRESS ── */
    .progress-area {
      width: 100%; margin-bottom: 20px;
    }
    .progress-meta {
      display: flex; justify-content: space-between;
      font-size: .8rem; font-weight: 600; color: var(--grey-400);
      margin-bottom: 8px;
    }
    .progress-bar-bg {
      width: 100%; height: 8px;
      background: var(--grey-200); border-radius: 99px; overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%; background: var(--blue-primary);
      border-radius: 99px;
      transition: width .5s cubic-bezier(.4,0,.2,1);
    }

    /* ── GO BACK ── */
    .back-btn {
      width: 100%; display: flex; align-items: center; gap: 5px;
      background: none; border: none; cursor: pointer;
      color: var(--grey-400); font-size: .8rem; font-weight: 600;
      font-family: inherit; padding: 0 0 12px 0;
      transition: color .2s;
    }
    .back-btn:hover { color: var(--grey-600); }
    .back-btn svg { width: 13px; height: 13px; flex-shrink: 0; }
    .back-btn.hidden { visibility: hidden; pointer-events: none; }

    /* ── CARD ── */
    .card {
      width: 100%;
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 36px 32px;
      animation: fadeUp .35s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .question-label {
      font-size: .72rem; font-weight: 700;
      color: var(--blue-primary); letter-spacing: .09em;
      text-transform: uppercase; margin-bottom: 10px;
    }
    .question-text {
      font-size: 1.22rem; font-weight: 700;
      color: var(--grey-800); line-height: 1.45;
      margin-bottom: 26px;
    }

    /* ── OPTIONS ── */
    .options { display: flex; flex-direction: column; gap: 11px; }

    .option {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 18px;
      border: 2px solid var(--grey-200);
      border-radius: 10px;
      cursor: pointer;
      background: var(--white);
      transition: border-color .18s, background .18s, transform .14s;
      font-size: .94rem; font-weight: 500; color: var(--grey-800);
      text-align: left; width: 100%; font-family: 'Playfair Display', Georgia, serif;
    }
    .option:hover {
      border-color: var(--blue-primary);
      background: var(--blue-light);
      transform: translateX(3px);
    }
    .option.selected {
      border-color: var(--blue-primary);
      background: var(--blue-light);
    }
    .option-bullet {
      width: 21px; height: 21px; min-width: 21px;
      border-radius: 50%;
      border: 2px solid var(--grey-400);
      display: flex; align-items: center; justify-content: center;
      transition: border-color .18s, background .18s;
      flex-shrink: 0;
    }
    .option.selected .option-bullet {
      border-color: var(--blue-primary);
      background: var(--blue-primary);
    }
    .option.selected .option-bullet::after {
      content: '';
      width: 7px; height: 7px;
      background: white; border-radius: 50%;
    }

    /* ── YES/NO ── */
    .yn-options { display: flex; gap: 14px; }
    .yn-btn {
      flex: 1; padding: 22px 10px;
      border-radius: 12px; border: 2.5px solid var(--grey-200);
      background: var(--white); cursor: pointer;
      font-size: 1rem; font-weight: 700; font-family: inherit;
      transition: all .2s;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      color: var(--grey-800);
    }
    .yn-btn .yn-icon { font-size: 1.8rem; }
    .yn-btn.yes:hover, .yn-btn.yes.selected {
      border-color: var(--blue-primary); background: var(--blue-light);
      color: var(--blue-dark);
      transform: translateY(-3px);
      box-shadow: 0 6px 22px rgba(34,197,94,.20);
    }
    .yn-btn.no:hover, .yn-btn.no.selected {
      border-color: var(--grey-400); background: var(--grey-100);
      color: var(--grey-600);
    }

    /* ── INTERMEDIATE MESSAGE ── */
    .mid-card {
      width: 100%;
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 40px 32px;
      text-align: center;
      animation: fadeUp .45s ease both;
    }
    .mid-icon {
      width: 72px; height: 72px;
      background: var(--blue-light);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      font-size: 2.2rem;
    }
    .mid-badge {
      display: inline-block;
      background: #DCFCE7; color: var(--green);
      font-size: .76rem; font-weight: 700;
      padding: 4px 12px; border-radius: 99px;
      letter-spacing: .07em; text-transform: uppercase;
      margin-bottom: 16px;
    }
    .mid-title {
      font-size: 1.5rem; font-weight: 800;
      color: var(--grey-800); line-height: 1.35;
      margin-bottom: 14px;
    }
    .mid-title span { color: var(--blue-primary); }
    .mid-body {
      font-size: .96rem; color: var(--grey-600);
      line-height: 1.68; margin-bottom: 24px;
    }
    .mid-highlights {
      display: flex; flex-direction: column; gap: 10px;
      background: var(--grey-100); border-radius: 10px;
      padding: 18px 20px; margin-bottom: 28px; text-align: left;
    }
    .mid-highlight-item {
      display: flex; align-items: center; gap: 10px;
      font-size: .88rem; font-weight: 500; color: var(--grey-800);
    }
    .mid-highlight-item .dot {
      width: 8px; height: 8px; min-width: 8px;
      background: var(--blue-primary); border-radius: 50%;
    }
    .btn-continue {
      width: 100%; padding: 16px;
      background: var(--blue-primary); color: white;
      font-size: 1rem; font-weight: 700; font-family: inherit;
      border: none; border-radius: 10px; cursor: pointer;
      transition: background .2s, transform .15s, box-shadow .2s;
    }
    .btn-continue:hover {
      background: var(--blue-dark);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(34,197,94,.30);
    }

    /* ── FINAL RESULT ── */
    .result-card {
      width: 100%;
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 40px 32px;
      text-align: center;
      animation: fadeUp .45s ease both;
    }
    .result-icon { font-size: 3rem; margin-bottom: 16px; }
    .result-badge {
      display: inline-block;
      background: #DCFCE7; color: var(--green);
      font-size: .76rem; font-weight: 700;
      padding: 4px 14px; border-radius: 99px;
      letter-spacing: .07em; text-transform: uppercase;
      margin-bottom: 18px;
    }
    .result-title {
      font-size: 1.5rem; font-weight: 800;
      color: var(--grey-800); line-height: 1.35; margin-bottom: 14px;
    }
    .result-title span { color: var(--blue-primary); }
    .result-body {
      font-size: .94rem; color: var(--grey-600);
      line-height: 1.72; margin-bottom: 26px;
    }
    .result-features {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px; margin-bottom: 28px;
    }
    .result-feature {
      background: var(--blue-light);
      border-radius: 10px; padding: 14px 12px;
      font-size: .83rem; font-weight: 600; color: var(--blue-dark);
      text-align: center;
    }
    .result-feature .f-icon { font-size: 1.3rem; display: block; margin-bottom: 4px; }
    .btn-cta {
      width: 100%; padding: 18px;
      background: var(--blue-primary); color: white;
      font-size: 1.05rem; font-weight: 800; font-family: inherit;
      border: none; border-radius: 10px; cursor: pointer;
      transition: background .2s, transform .15s, box-shadow .2s;
    }
    .btn-cta:hover {
      background: var(--blue-dark);
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(34,197,94,.35);
    }
    .cta-sub {
      font-size: .79rem; color: var(--grey-400);
      margin-top: 12px;
    }

    /* ── TRUST BAR ── */
    .trust-bar {
      width: 100%; max-width: 660px;
      padding: 0 16px;
      display: flex; justify-content: center; gap: 24px;
      flex-wrap: wrap; margin-top: 24px;
    }
    .trust-item {
      display: flex; align-items: center; gap: 6px;
      font-size: .77rem; color: var(--grey-400); font-weight: 500;
    }
    .trust-item svg { width: 14px; height: 14px; flex-shrink: 0; }

    /* ── RESPONSIVE ── */
    @media (max-width: 480px) {
      .card, .mid-card, .result-card { padding: 26px 18px; }
      .question-text { font-size: 1.08rem; }
      .result-features { grid-template-columns: 1fr; }
      .yn-options { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <a class="logo" href="#">
      <img src="img/LOGO.png" alt="Regenex Hair" style="height:48px;width:auto;">
    </a>
  </header>

  <!-- MAIN -->
  <main class="wrapper">
    <div class="progress-area" id="progressArea">
      <button class="back-btn hidden" id="backBtn" onclick="goBack()">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        Go back
      </button>
      <div class="progress-meta">
        <span id="progressLabel">Question 1 of 13</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
      </div>
    </div>

    <div id="quizContainer"></div>
  </main>

  <!-- TRUST BAR -->
  <div class="trust-bar">
    <div class="trust-item">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
      100% safe &amp; free
    </div>
    <div class="trust-item">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
      Your answers are private
    </div>
    <div class="trust-item">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      Takes less than 2 minutes
    </div>
  </div>

  <script>
    // ─────────────────────────────────────────────
    //  ADAPTIVE QUIZ ENGINE
    //  Every question's text, options and next step
    //  are resolved against accumulated answers.
    // ─────────────────────────────────────────────

    var TOTAL_Q = 13;
    var CHECKOUT = 'https://pay.hotmart.com/R104643182T?checkoutMode=10';

    // answers keyed by question id
    // q1 = gender index (0=male,1=female,2=prefer not to say)
    // q2 = age index
    // q3 = duration index
    // q4 = intensity index
    // q5 = location index
    // q6m/q6f = branched q6
    // q7 = emotional impact index
    // q8a/q8b = branched q8
    // q9 = family history index
    // q10 = previous treatment index
    // q11/q12/q13 = yesno (0=yes,1=no)

    var A = {};       // answers
    var qHistory = []; // breadcrumb of visited question IDs
    var currentQId = 'q1';
    var advancing  = false;

    function isFemale() { return A.q1 === 1; }
    function dur()      { return A.q3 || 0; }  // 0=<6mo 1=6-12mo 2=1-3yr 3=3yr+
    function sev()      { return A.q4 || 0; }  // 0=mild … 3=severe
    function impact()   { return A.q7 !== undefined ? A.q7 : 2; } // 0=a lot … 3=not really
    function prev()     { return A.q10 !== undefined ? A.q10 : 3; } // 0=no result 1=side effects 2=partial 3=never

    var Q = {

      q1: {
        text: "Let's personalize this for you. What is your gender?",
        type: 'choice',
        options: ['Male', 'Female', 'Prefer not to say'],
        next: function() { return 'q2'; }
      },

      q2: {
        text: 'What is your age range?',
        type: 'choice',
        options: ['18–29 years old', '30–39 years old', '40–49 years old', '50 years or older'],
        next: function() { return 'q3'; }
      },

      q3: {
        text: 'How long have you been noticing hair loss?',
        type: 'choice',
        options: ['Less than 6 months', '6 months to 1 year', '1 to 3 years', 'More than 3 years'],
        next: function() { return 'q4'; }
      },

      q4: {
        text: function() {
          return dur() >= 2
            ? "Given that you've been dealing with this for a while — how would you describe the intensity today?"
            : 'How would you describe the intensity of your hair loss?';
        },
        type: 'choice',
        options: [
          'Mild — a few extra hairs here and there',
          'Moderate — clearly more than normal',
          'Heavy — large amounts falling out',
          'Severe — visible bald patches or spots'
        ],
        next: function() { return 'q5'; }
      },

      q5: {
        text: 'Where do you notice the most hair loss?',
        type: 'choice',
        options: ['Top or crown of my head', 'Hairline or temples', 'All over — diffuse thinning', 'On the sides'],
        next: function() { return isFemale() ? 'q6f' : 'q6m'; }
      },

      // ── Q6 — MALE branch ──
      q6m: {
        text: function() {
          var loc = A.q5 || 0;
          if (loc === 0) return 'Besides losing hair — has the crown area also become visibly thinner or finer?';
          if (loc === 1) return 'Beyond your hairline — has your hair overall become thinner and finer too?';
          return 'Has your hair become thinner and finer all over, or mainly falling in one area?';
        },
        type: 'choice',
        options: [
          'Yes — noticeably thinner and finer',
          'A little bit thinner, yes',
          'Mainly falling, not much thinner',
          "I'm not sure"
        ],
        next: function() { return 'q7'; }
      },

      // ── Q6 — FEMALE branch ──
      q6f: {
        text: 'Do you think your hair loss may be connected to any of the following?',
        type: 'choice',
        options: [
          'Pregnancy or postpartum changes',
          'Menopause or hormonal shifts',
          'A period of high stress',
          "I'm not sure of the cause"
        ],
        next: function() { return 'q7'; }
      },

      // ── Q7 — Emotional impact (gender + severity adaptive) ──
      q7: {
        text: function() {
          if (isFemale() && sev() >= 2) return 'Has the hair loss started affecting how you feel about your appearance or your confidence as a woman?';
          if (isFemale())               return 'Has hair loss made you feel less confident or self-conscious about your appearance?';
          if (sev() >= 2)               return 'Has the hair loss started impacting your confidence or how you present yourself?';
          return 'Has hair loss affected your self-esteem or confidence in any way?';
        },
        type: 'choice',
        options: [
          "Yes — it affects me daily and is hard to ignore",
          "Sometimes it weighs on me more than I'd like",
          'Rarely — but it does cross my mind',
          "Not really — I'm mainly focused on prevention"
        ],
        next: function() { return impact() <= 1 ? 'q8a' : 'q8b'; }
      },

      // ── Q8a — High emotional impact ──
      q8a: {
        text: function() {
          return isFemale()
            ? "We hear that a lot. What bothers you most on a day-to-day basis?"
            : "That's completely understandable. What affects you most day-to-day?";
        },
        type: 'choice',
        options: function() {
          return isFemale()
            ? ['Avoiding photos or social events', 'Spending extra time styling to cover it', 'Feeling less attractive or feminine', 'Fear it will keep getting worse']
            : ['Avoiding photos or social situations', 'Feeling less confident professionally', 'Feeling less attractive or youthful', 'Fear it will keep getting worse'];
        },
        next: function() { return 'q9'; }
      },

      // ── Q8b — Lower emotional impact ──
      q8b: {
        text: function() {
          return isFemale()
            ? "If you could have thicker, fuller hair again — what would that change for you?"
            : "If you could recover your hair density — what would that mean for you?";
        },
        type: 'choice',
        options: function() {
          return isFemale()
            ? ["I'd feel much more confident in how I look", "I'd stop worrying about it getting worse", "I'd spend less time trying to cover it up", 'It would give me peace of mind']
            : ["I'd feel more confident and look younger", "I'd stop worrying about it getting worse", "I'd feel better in professional and social settings", 'It would give me peace of mind'];
        },
        next: function() { return 'q9'; }
      },

      // ── Q9 — Family history ──
      q9: {
        text: 'Does anyone in your immediate family also experience hair loss?',
        type: 'choice',
        options: ["Yes — on my father's side", "Yes — on my mother's side", 'Yes — on both sides', "Not that I'm aware of"],
        next: function() { return 'q10'; }
      },

      // ── Q10 — Previous treatments → triggers mid message ──
      q10: {
        text: 'Have you ever tried any treatment for hair loss before?',
        type: 'choice',
        options: [
          "Yes — but without satisfactory results",
          'Yes — but stopped due to side effects',
          'Yes — with some partial improvement',
          'No — this would be my first treatment'
        ],
        next: function() { return 'MID'; }
      },

      // ── Q11 — Adaptive opener (based on treatment history + gender) ──
      q11: {
        text: function() {
          if (prev() === 0) return isFemale()
            ? "What if previous treatments didn't work because they weren't designed for your specific hair profile? Would you be open to something truly targeted?"
            : "Most treatments fail because they're generic. What if there was a protocol designed specifically for your type of hair loss? Would you try it?";
          if (prev() === 1) return "What if you found a 100% natural treatment — no chemicals, zero side effects — that actually delivered results? Would you give it a chance?";
          if (prev() === 2) return "What if you could build on those partial results with a complete protocol that finally takes you to full recovery? Interested?";
          return isFemale()
            ? "If you could start a completely natural, side-effect-free treatment this week and see results in 3 weeks — would you be open to trying?"
            : "If you could start a proven, natural treatment this week and see real results in 3 weeks — would you give it a try?";
        },
        type: 'yesno',
        next: function() { return 'q12'; }
      },

      // ── Q12 — Commitment (based on duration + severity + gender) ──
      q12: {
        text: function() {
          if (dur() >= 2 && sev() >= 2) return isFemale()
            ? "Even after years of hair loss — would you commit just 5 minutes a day to finally get it back?"
            : "Even after years of hair loss — would you commit to a simple 5-minute daily routine if it meant real, visible results?";
          if (dur() >= 2) return "You've been dealing with this for a while. If a proven solution could reverse it in 21 days — would you take that chance?";
          return "Would you be willing to dedicate just a few minutes a day to a natural treatment that could show results in under a month?";
        },
        type: 'yesno',
        next: function() { return 'q13'; }
      },

      // ── Q13 — Final CTA softener (gender + impact adaptive) ──
      q13: {
        text: function() {
          if (isFemale() && impact() <= 1) return "Are you ready to take back your confidence — starting with your hair, starting this week?";
          if (isFemale())                  return "Are you ready to take the first real step toward thicker, healthier hair?";
          if (impact() <= 1)               return "Are you ready to stop watching it happen and actually do something about it — starting today?";
          return "Are you ready to take control and start Regenex this week?";
        },
        type: 'yesno',
        next: function() { return 'RESULT'; }
      }
    };

    // ─────────────────────────────────────────────
    //  DOM references
    // ─────────────────────────────────────────────
    var container    = document.getElementById('quizContainer');
    var progressArea = document.getElementById('progressArea');
    var progressFill = document.getElementById('progressFill');
    var progressLabel= document.getElementById('progressLabel');
    var progressPct  = document.getElementById('progressPct');
    var backBtn      = document.getElementById('backBtn');

    function resolve(val) {
      return typeof val === 'function' ? val() : val;
    }

    function qNum() {
      return qHistory.length + 1;
    }

    function updateProgress() {
      var n   = qNum();
      var pct = Math.round(((n - 1) / TOTAL_Q) * 100);
      progressFill.style.width   = pct + '%';
      progressLabel.textContent  = 'Question ' + n + ' of ' + TOTAL_Q;
      progressPct.textContent    = pct + '%';
    }

    function showBack(vis) {
      backBtn.classList.toggle('hidden', !vis);
    }

    // ─────────────────────────────────────────────
    //  Render a question by ID
    // ─────────────────────────────────────────────
    function renderQuestion(qId) {
      var q    = Q[qId];
      var text = resolve(q.text);
      var num  = qNum();

      updateProgress();
      showBack(qHistory.length > 0);
      advancing = false;

      if (q.type === 'choice') {
        var opts = resolve(q.options);
        container.innerHTML =
          '<div class="card">' +
            '<div class="question-label">Question ' + num + ' of ' + TOTAL_Q + '</div>' +
            '<div class="question-text">' + text + '</div>' +
            '<div class="options" id="options"></div>' +
          '</div>';

        var optsEl = document.getElementById('options');
        opts.forEach(function(opt, i) {
          var btn = document.createElement('button');
          btn.className = 'option';
          if (A[qId] === i) btn.classList.add('selected');
          btn.innerHTML = '<div class="option-bullet"></div><span>' + opt + '</span>';
          btn.onclick   = function() { selectAndAdvance(btn, i, qId); };
          optsEl.appendChild(btn);
        });

      } else {
        // yes/no
        container.innerHTML =
          '<div class="card">' +
            '<div class="question-label">Question ' + num + ' of ' + TOTAL_Q + '</div>' +
            '<div class="question-text">' + text + '</div>' +
            '<div class="yn-options">' +
              '<button class="yn-btn yes" onclick="handleYesNo(\'yes\',\'' + qId + '\')">' +
                '<span class="yn-icon">&#x1F44D;</span>Yes, I want that!' +
              '</button>' +
              '<button class="yn-btn no" onclick="handleYesNo(\'no\',\'' + qId + '\')">' +
                '<span class="yn-icon">&#x274C;</span>No' +
              '</button>' +
            '</div>' +
          '</div>';
      }
    }

    // ─────────────────────────────────────────────
    //  Navigation
    // ─────────────────────────────────────────────
    function selectAndAdvance(btn, idx, qId) {
      if (advancing) return;
      advancing = true;
      document.querySelectorAll('.option').forEach(function(o) { o.classList.remove('selected'); });
      btn.classList.add('selected');
      A[qId] = idx;

      setTimeout(function() {
        var nextId = Q[qId].next();
        qHistory.push(currentQId);
        currentQId = nextId;
        if (nextId === 'MID') showMidMessage();
        else renderQuestion(nextId);
      }, 320);
    }

    function handleYesNo(val, qId) {
      if (advancing) return;
      advancing = true;
      A[qId] = (val === 'yes') ? 0 : 1;
      var sel = document.querySelector('.yn-btn.' + (val === 'yes' ? 'yes' : 'no'));
      if (sel) sel.classList.add('selected');

      setTimeout(function() {
        var nextId = Q[qId].next();
        qHistory.push(currentQId);
        currentQId = nextId;
        if (nextId === 'RESULT') showResult();
        else renderQuestion(nextId);
      }, 300);
    }

    function goBack() {
      if (qHistory.length === 0) return;
      var prevId = qHistory.pop();
      currentQId = prevId;
      if (prevId === 'MID') { showMidMessage(); return; }
      progressArea.style.display = 'block';
      renderQuestion(prevId);
    }

    // ─────────────────────────────────────────────
    //  Mid message — fully adaptive
    // ─────────────────────────────────────────────
    function showMidMessage() {
      progressArea.style.display = 'none';
      showBack(false);
      advancing = false;

      var titleInner = (sev() >= 2)
        ? (isFemale() ? 'treatable — even at this stage' : 'a treatable hair loss profile')
        : 'strong recovery potential';

      var body = isFemale()
        ? (sev() >= 2
            ? "Many women with a profile like yours — even with significant hair loss — have seen remarkable results with the right targeted treatment. The key is addressing the root cause, not masking symptoms."
            : "Based on what you've shared, your hair loss is at a stage where natural intervention is highly effective. The sooner you act, the better your results will be.")
        : (sev() >= 2
            ? "Men with a profile like yours often see strong results when the right protocol is applied in time. The follicles are still active — they just need the right stimulus to wake up."
            : "Based on your answers, your hair follicles are likely still viable and responsive. Natural stimulation at this stage can make a significant difference.");

      var h1 = (prev() === 0)
        ? 'Root cause identified — previous treatments missed this'
        : 'Hair loss profile with a clear, addressable cause';
      var h3 = (dur() >= 2)
        ? 'Recovery possible even after extended hair loss'
        : 'High likelihood of visible results within 3 weeks';

      container.innerHTML =
        '<div class="mid-card">' +
          '<div class="mid-icon">&#x1F4A1;</div>' +
          '<div class="mid-badge">Analysis Almost Complete</div>' +
          '<div class="mid-title">Your profile shows <span>' + titleInner + '</span></div>' +
          '<p class="mid-body">' + body + '</p>' +
          '<div class="mid-highlights">' +
            '<div class="mid-highlight-item"><div class="dot"></div>' + h1 + '</div>' +
            '<div class="mid-highlight-item"><div class="dot"></div>Follicle profile compatible with rapid recovery</div>' +
            '<div class="mid-highlight-item"><div class="dot"></div>' + h3 + '</div>' +
          '</div>' +
          '<button class="btn-continue" onclick="continueMid()">See your personalized treatment &rarr;</button>' +
        '</div>';
    }

    function continueMid() {
      qHistory.push('MID');
      currentQId = 'q11';
      progressArea.style.display = 'block';
      renderQuestion('q11');
    }

    // ─────────────────────────────────────────────
    //  Result — fully adaptive
    // ─────────────────────────────────────────────
    function showResult() {
      progressArea.style.display = 'none';
      showBack(false);

      var title, body;
      if (isFemale()) {
        title = (impact() <= 1)
          ? 'Your hair <span>can grow back</span> — and your confidence with it'
          : 'Your hair <span>can grow back</span> in as little as 3 weeks';
        body  = 'Congratulations on completing the assessment! Based on your profile, Regenex Hair is formulated to address the specific causes of hair loss in women — stimulating dormant follicles and restoring thickness at the root. 100% natural, zero side effects, and most women report visible improvement in under 30 days.';
      } else {
        title = (sev() >= 2)
          ? "It's not too late — your hair <span>can grow back</span>"
          : 'Your hair <span>can grow back</span> in as little as 3 weeks';
        body  = "Congratulations on completing the assessment! Based on your profile, Regenex Hair is designed to reactivate dormant follicles and reverse hair loss at the source — 100% natural, with no side effects. Most users report visible results in under 30 days.";
      }

      container.innerHTML =
        '<div class="result-card">' +
          '<div class="result-icon">&#x1F3C6;</div>' +
          '<div class="result-badge">You Are an Ideal Candidate</div>' +
          '<div class="result-title">' + title + '</div>' +
          '<p class="result-body">' + body + '</p>' +
          '<div class="result-features">' +
            '<div class="result-feature"><span class="f-icon">&#x1F33F;</span>100% Natural</div>' +
            '<div class="result-feature"><span class="f-icon">&#x23F1;</span>Results in 3 weeks</div>' +
            '<div class="result-feature"><span class="f-icon">&#x1F46B;</span>For Men &amp; Women</div>' +
            '<div class="result-feature"><span class="f-icon">&#x2705;</span>No side effects</div>' +
          '</div>' +
          '<button class="btn-cta" onclick="handleCTA()">Get the full treatment now &rarr;</button>' +
          '<p class="cta-sub">Limited access &bull; Secure checkout &bull; Results in 3 weeks</p>' +
        '</div>';
    }

    function handleCTA() {
      window.location.href = CHECKOUT;
    }

    // ── INIT ──
    renderQuestion('q1');

    // ── BACK BUTTON REDIRECT ──
    history.pushState(null, '', location.href);
    window.addEventListener('popstate', function() {
      history.pushState(null, '', location.href);
      window.location.replace(CHECKOUT);
    });
  </script>
</body>
</html>
